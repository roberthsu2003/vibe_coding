<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 760" width="460" height="760">
  <defs>
    <filter id="cardShadow2" x="-5%" y="-3%" width="110%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- 背景底色 -->
  <rect width="460" height="760" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- 頂部導航條 -->
  <g transform="translate(16, 16)">
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#0F172A">Publish your app</text>
    <circle cx="160" cy="18" r="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="160" y="22" text-anchor="middle" font-size="11" font-weight="bold" fill="#64748B">i</text>
  </g>

  <!-- 進度條 -->
  <rect x="16" y="55" width="210" height="3" rx="1.5" fill="#2563EB" />
  <rect x="230" y="55" width="214" height="3" rx="1.5" fill="#2563EB" />

  <!-- 返回與步驟標題 -->
  <g transform="translate(16, 85)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#64748B">←</text>
    <text x="24" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#475569">Step 2</text>
    <text x="75" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#0F172A">Final touches</text>
  </g>

  <!-- 應用程式預覽卡片 -->
  <g transform="translate(24, 115)">
    <rect width="412" height="155" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#cardShadow2)" />
    
    <!-- 圖示與標題 -->
    <rect x="18" y="18" width="36" height="36" rx="8" fill="#9333EA" />
    <text x="36" y="42" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">U</text>
    
    <text x="64" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', sans-serif" font-size="13" font-weight="600" fill="#475569">Universal Template Filler - 通用型 Excel</text>
    <text x="64" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', sans-serif" font-size="15" font-weight="800" fill="#0F172A">Universal Template Filler</text>

    <!-- 描述 -->
    <text x="18" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', sans-serif" font-size="12" fill="#64748B">免伺服器、零 API Key 的通用型 Excel 佔位符單據產生器。</text>
    <text x="18" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', sans-serif" font-size="12" fill="#64748B">自動掃描 {{變數名稱 | 預設值}} 動態產生表單，一鍵填回並保留</text>
    <text x="18" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', sans-serif" font-size="12" fill="#64748B">Logo 圖片、樣式與計算公式。</text>
  </g>

  <!-- Description 編輯區 -->
  <g transform="translate(24, 295)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#334155">Description</text>
    <rect x="0" y="10" width="412" height="75" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="14" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', sans-serif" font-size="12" fill="#1E293B">免伺服器、零 API Key 的通用型 Excel 佔位符單據產生器。自</text>
    <text x="14" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', sans-serif" font-size="12" fill="#1E293B">動掃描 {{變數名稱 | 預設值}} 動態產生表單，一鍵填回並保留</text>
    <text x="14" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', sans-serif" font-size="12" fill="#1E293B">Logo 圖片、樣式與計算公式。</text>
  </g>

  <!-- App URL 自訂網址區 -->
  <g transform="translate(24, 410)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#334155">App URL</text>
    
    <!-- 輸入框 -->
    <rect x="0" y="10" width="280" height="42" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" />
    <text x="12" y="36" font-family="Courier, monospace" font-size="13" font-weight="bold" fill="#0F172A">universal-template-filler-excel</text>
    
    <!-- 後綴網址 -->
    <text x="290" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#2563EB">.ai.studio</text>
  </g>

  <!-- 5 大綠色打勾規則 -->
  <g transform="translate(26, 480)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#334155">
    <g transform="translate(0, 0)">
      <circle cx="8" cy="8" r="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
      <path d="M 5 8 L 7.5 10.5 L 11 5.5" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round"/>
      <text x="24" y="12">6–63 characters (長度 6-63 字元)</text>
    </g>

    <g transform="translate(0, 24)">
      <circle cx="8" cy="8" r="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
      <path d="M 5 8 L 7.5 10.5 L 11 5.5" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round"/>
      <text x="24" y="12">Only uses lowercase letters, numbers or hyphens (小寫英文/數字/破折號)</text>
    </g>

    <g transform="translate(0, 48)">
      <circle cx="8" cy="8" r="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
      <path d="M 5 8 L 7.5 10.5 L 11 5.5" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round"/>
      <text x="24" y="12">Starts and ends with a letter or number (字母或數字開頭結尾)</text>
    </g>

    <g transform="translate(0, 72)">
      <circle cx="8" cy="8" r="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
      <path d="M 5 8 L 7.5 10.5 L 11 5.5" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round"/>
      <text x="24" y="12">No consecutive hyphens (無連續破折號)</text>
    </g>

    <g transform="translate(0, 96)">
      <circle cx="8" cy="8" r="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
      <path d="M 5 8 L 7.5 10.5 L 11 5.5" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round"/>
      <text x="24" y="12">No reserved or prohibited terms (無保留或違禁字詞)</text>
    </g>
  </g>

  <!-- 底部發布主按鈕 -->
  <g transform="translate(24, 690)">
    <rect width="412" height="52" rx="26" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="206" y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Publish your app</text>
  </g>
</svg>
