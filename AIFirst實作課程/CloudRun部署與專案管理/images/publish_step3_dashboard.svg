<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 760" width="460" height="760">
  <defs>
    <!-- 彩色漸層頂部 -->
    <linearGradient id="auroraGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FDE68A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#86EFAC" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- 背景底色 -->
  <rect width="460" height="760" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- 頂部彩色極光橫幅 -->
  <path d="M 0 0 L 460 0 L 460 160 Q 230 220 0 160 Z" fill="url(#auroraGlow)" />

  <!-- 頂部 Tab 工具列 -->
  <g transform="translate(16, 16)">
    <circle cx="10" cy="16" r="3" fill="#94A3B8" />
    <rect x="30" y="0" width="80" height="32" rx="16" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="44" cy="16" r="3.5" fill="#10B981" />
    <text x="56" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#0F172A">Publish</text>

    <rect x="118" y="0" width="75" height="32" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="133" y="21" font-family="sans-serif" font-size="13" fill="#64748B">Versions</text>

    <rect x="201" y="0" width="68" height="32" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="216" y="21" font-family="sans-serif" font-size="13" fill="#64748B">GitHub</text>

    <rect x="277" y="0" width="95" height="32" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="290" y="21" font-family="sans-serif" font-size="13" fill="#64748B">Integrations</text>
  </g>

  <!-- 中心 App 紫色圖示 -->
  <g transform="translate(195, 125)">
    <rect width="70" height="70" rx="18" fill="#9333EA" stroke="#FFFFFF" stroke-width="3" />
    <text x="35" y="47" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#FFFFFF">U</text>
  </g>

  <!-- 標題：... is published! -->
  <text x="230" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', sans-serif" font-size="15" font-weight="700" fill="#0F172A">Universal Template Filler - 通用型 Excel</text>
  <text x="230" y="258" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', sans-serif" font-size="17" font-weight="800" fill="#0F172A">佔位符單據產生器 is published!</text>

  <!-- 兩顆核心操作按鈕：Visit & Republish -->
  <g transform="translate(24, 285)">
    <!-- Visit 按鈕 -->
    <rect x="0" y="0" width="195" height="46" rx="23" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="80" y="28" font-family="sans-serif" font-size="14" fill="#0F172A">🌐</text>
    <text x="102" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Visit</text>

    <!-- Republish 按鈕 -->
    <rect x="215" y="0" width="195" height="46" rx="23" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="285" y="28" font-family="sans-serif" font-size="14" fill="#0F172A">🔄</text>
    <text x="307" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Republish</text>
  </g>

  <!-- 狀態詳細資訊卡片 -->
  <g transform="translate(24, 355)">
    <rect width="412" height="235" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />

    <!-- Status -->
    <text x="20" y="32" font-family="sans-serif" font-size="13" font-weight="600" fill="#64748B">Status</text>
    <circle cx="26" cy="54" r="4.5" fill="#10B981" />
    <text x="36" y="58" font-family="sans-serif" font-size="14" font-weight="700" fill="#0F172A">Ready</text>

    <!-- App URL -->
    <text x="20" y="98" font-family="sans-serif" font-size="13" font-weight="600" fill="#64748B">App URL</text>
    <text x="20" y="125" font-family="Courier, monospace" font-size="14" font-weight="bold" fill="#2563EB">universal-template-filler-excel.ai.studio</text>
    <text x="365" y="125" font-family="sans-serif" font-size="12" fill="#2563EB">✓</text>

    <!-- Gemini API -->
    <text x="20" y="165" font-family="sans-serif" font-size="13" font-weight="600" fill="#64748B">Gemini API</text>
    <text x="20" y="195" font-family="Courier, monospace" font-size="14" font-weight="600" fill="#0F172A">API Key ...c8gA</text>
    <text x="140" y="195" font-family="sans-serif" font-size="14" fill="#64748B">👁️</text>
    <text x="165" y="195" font-family="sans-serif" font-size="14" fill="#64748B">📋</text>
    <text x="20" y="218" font-family="sans-serif" font-size="11" fill="#10B981">🛡️ 由 Backend Proxy 伺服器代理保護</text>
  </g>

  <!-- 底部兩大管理按鈕 -->
  <g transform="translate(24, 615)">
    <!-- Advanced settings -->
    <rect x="0" y="0" width="195" height="48" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="97" y="29" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Advanced settings</text>

    <!-- Unpublish app (核心下架按鈕) -->
    <rect x="215" y="0" width="195" height="48" rx="24" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5" />
    <text x="312" y="29" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#DC2626">Unpublish app</text>
  </g>

  <!-- 醒目引導標籤 -->
  <g transform="translate(210, 680)">
    <rect width="225" height="38" rx="8" fill="#EF4444" />
    <text x="112" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">👈 點此一鍵下架，釋出 2 個免費名額！</text>
  </g>
</svg>
