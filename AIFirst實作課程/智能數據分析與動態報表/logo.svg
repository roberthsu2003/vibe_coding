<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- 背景漸層 -->
    <linearGradient id="biBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- 柱狀圖漸層 -->
    <linearGradient id="bar1Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="bar2Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="bar3Grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- 折線漸層 -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- 柔和陰影 -->
    <filter id="biShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2563EB" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- 外卡圓角框 -->
  <rect width="240" height="240" rx="48" fill="url(#biBgGrad)" />
  <rect width="236" height="236" x="2" y="2" rx="46" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- 數據坐標軸與卡片 -->
  <g transform="translate(38, 38)" filter="url(#biShadow)">
    <!-- 底卡 -->
    <rect width="164" height="124" rx="24" fill="#1E293B" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.8" />

    <!-- 網格橫虛線 -->
    <line x1="20" y1="36" x2="144" y2="36" stroke="#334155" stroke-dasharray="3,3" stroke-width="1" />
    <line x1="20" y1="64" x2="144" y2="64" stroke="#334155" stroke-dasharray="3,3" stroke-width="1" />
    <line x1="20" y1="92" x2="144" y2="92" stroke="#475569" stroke-width="1.2" />

    <!-- 3 條立體長條柱 (Bar Chart) -->
    <rect x="32" y="58" width="18" height="34" rx="4" fill="url(#bar1Grad)" />
    <rect x="62" y="38" width="18" height="54" rx="4" fill="url(#bar2Grad)" />
    <rect x="92" y="46" width="18" height="46" rx="4" fill="url(#bar3Grad)" />

    <!-- 增長趨勢折線 (Trend Line) -->
    <path d="M41,52 L71,28 L101,36 L134,18" fill="none" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- 節點光點 -->
    <circle cx="41" cy="52" r="3.5" fill="#38BDF8" />
    <circle cx="71" cy="28" r="3.5" fill="#F59E0B" />
    <circle cx="101" cy="36" r="3.5" fill="#8B5CF6" />
    <circle cx="134" cy="18" r="4.5" fill="#EC4899" stroke="#FFFFFF" stroke-width="1.5" />

    <!-- AI 洞察星芒 (Sparkles) -->
    <path d="M142,66 C142,71 138,75 133,75 C138,75 142,79 142,84 C142,79 146,75 151,75 C146,75 142,71 142,66 Z" fill="#FBBF24" />
  </g>

  <!-- 浮動數據徽章 (CSV / XLSX Badge) -->
  <g transform="translate(48, 172)">
    <rect width="64" height="26" rx="8" fill="#047857" fill-opacity="0.3" stroke="#10B981" stroke-width="1.2" />
    <text x="32" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#34D399" text-anchor="middle">.XLSX</text>

    <rect x="76" y="0" width="64" height="26" rx="8" fill="#1D4ED8" fill-opacity="0.3" stroke="#3B82F6" stroke-width="1.2" />
    <text x="108" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#60A5FA" text-anchor="middle">.CSV</text>
  </g>

  <!-- 底部文字 -->
  <text x="120" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#94A3B8" text-anchor="middle">AI DATA INSIGHTS</text>
</svg>
