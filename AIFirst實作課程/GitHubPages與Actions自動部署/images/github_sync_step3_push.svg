<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 760" width="460" height="760">
  <defs>
    <!-- 卡片陰影效果 -->
    <filter id="pushShadow" x="-5%" y="-3%" width="110%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- 背景面板外框 -->
  <rect width="460" height="760" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- 頂部頁籤列 (Tabs) -->
  <g transform="translate(14, 16)">
    <!-- Chat -->
    <rect x="0" y="0" width="56" height="32" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="28" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#475569">Chat</text>

    <!-- Share -->
    <rect x="62" y="0" width="60" height="32" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="92" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#475569">Share</text>

    <!-- Publish -->
    <rect x="128" y="0" width="68" height="32" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="162" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#475569">Publish</text>

    <!-- Versions -->
    <rect x="202" y="0" width="74" height="32" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="239" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#475569">Versions</text>

    <!-- GitHub (選中) -->
    <rect x="282" y="0" width="80" height="32" rx="16" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.5"/>
    <circle cx="294" cy="16" r="3.5" fill="#0F172A" />
    <text x="324" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0F172A">GitHub</text>

    <!-- 關閉按鈕 X -->
    <path d="M 425 11 L 433 19 M 433 11 L 425 19" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- 面板標題 -->
  <text x="20" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0F172A">GitHub sync</text>

  <!-- Repository 資訊卡片 -->
  <g transform="translate(20, 115)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', sans-serif">
    <text x="0" y="0" font-size="13" font-weight="600" fill="#64748B">Repository</text>

    <g transform="translate(0, 10)">
      <!-- 儲存庫名稱文字 -->
      <text x="0" y="24" font-size="15" font-weight="700" fill="#0F172A">roberthsu2004/Universal_Template_Filler-</text>
      
      <!-- 分支標籤 (• main) -->
      <g transform="translate(245, 6)">
        <rect width="60" height="24" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
        <circle cx="12" cy="12" r="3" fill="#2563EB" />
        <text x="22" y="16" font-size="11" font-weight="600" fill="#1E293B">main</text>
      </g>

      <!-- 解除綁定按鈕 (Link off) -->
      <g transform="translate(325, 6)">
        <rect width="28" height="24" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <path d="M 8 12 L 14 12 M 16 8 L 20 8 M 8 16 L 12 16" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
      </g>

      <!-- 前往 GitHub 外部連結按鈕 (↗) -->
      <g transform="translate(362, 6)">
        <rect width="28" height="24" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <path d="M 9 15 L 17 7 M 11 7 L 17 7 L 17 13" fill="none" stroke="#0F172A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <!-- Sync status 狀態卡片 (待推送提示) -->
  <g transform="translate(20, 205)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', sans-serif">
    <text x="0" y="0" font-size="13" font-weight="600" fill="#64748B">Sync status</text>

    <!-- 卡片外框 -->
    <g transform="translate(0, 10)">
      <rect width="420" height="65" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#pushShadow)"/>
      <text x="16" y="38" font-size="14" font-weight="600" fill="#1E293B">Changes in Google AI Studio are ready to be pushed</text>
      <!-- 資訊小圖示 (i) -->
      <circle cx="395" cy="34" r="8" fill="#F1F5F9" />
      <text x="395" y="38" text-anchor="middle" font-size="11" font-weight="bold" fill="#64748B">i</text>
    </g>
  </g>

  <!-- 變更詳情列表 (Commit message / changed files) -->
  <g transform="translate(20, 315)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', sans-serif">
    <!-- Commit message 項目 -->
    <g transform="translate(0, 0)">
      <rect width="420" height="48" rx="8" fill="#FFFFFF" />
      <text x="0" y="30" font-size="14" fill="#334155">Commit message</text>
      <text x="405" y="30" font-size="16" fill="#94A3B8">›</text>
      <line x1="0" y1="48" x2="420" y2="48" stroke="#F1F5F9" stroke-width="1"/>
    </g>

    <!-- 24 changed files 項目 -->
    <g transform="translate(0, 52)">
      <rect width="420" height="48" rx="8" fill="#FFFFFF" />
      <text x="0" y="30" font-size="14" fill="#334155">24 changed files</text>
      <text x="405" y="30" font-size="16" fill="#94A3B8">›</text>
      <line x1="0" y1="48" x2="420" y2="48" stroke="#F1F5F9" stroke-width="1"/>
    </g>
  </g>

  <!-- 說明指示註解卡 -->
  <g transform="translate(20, 460)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', sans-serif">
    <rect width="420" height="120" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="16" y="28" font-size="13" font-weight="700" fill="#0F172A">💡 什麼時候需要點擊下方 Push 按鈕？</text>
    <text x="16" y="54" font-size="12" fill="#475569">1. 【首次建立時】：將專案所有檔案推上 GitHub，正式產生儲存庫。</text>
    <text x="16" y="78" font-size="12" fill="#475569">2. 【下完 Prompt 後】：AI 生成了 deploy.yml 與更新 vite.config.ts 後，</text>
    <text x="32" y="98" font-size="12" font-weight="700" fill="#2563EB">務必「再次點擊 Push」，CI/CD 檔案才會同步推上 GitHub！</text>
  </g>

  <!-- 底部操作按鈕 -->
  <g transform="translate(20, 660)">
    <!-- 虛線引導框 -->
    <rect x="-6" y="-6" width="432" height="62" rx="28" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="6,4" />
    <text x="210" y="-12" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', sans-serif" font-size="12" font-weight="700" fill="#2563EB">👉 第三步：點擊「Push changes to GitHub」開始推送！</text>

    <!-- 按鈕本體 -->
    <rect width="420" height="50" rx="25" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <!-- 上傳箭頭圖示 -->
    <g transform="translate(140, 18)">
      <path d="M 6 14 L 6 3 M 2 7 L 6 3 L 10 7 M 1 14 L 11 14" fill="none" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="220" y="31" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#0F172A">Push changes to GitHub</text>
  </g>
</svg>
