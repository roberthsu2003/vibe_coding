<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560">
  <defs>
    <filter id="shadowBox" x="-5%" y="-3%" width="110%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- 整體背景（GitHub 淺灰底色） -->
  <rect width="960" height="560" rx="12" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5" />

  <!-- 1. 頂部導航列 (Repository Header) -->
  <g transform="translate(0, 0)">
    <rect width="960" height="85" fill="#FFFFFF" border-bottom="1px" />
    <line x1="0" y1="85" x2="960" y2="85" stroke="#D0D7DE" stroke-width="1" />

    <!-- 倉庫路徑標題 -->
    <g transform="translate(24, 22)">
      <!-- GitHub 標誌 -->
      <path fill="#24292F" d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
      <text x="32" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#0969DA">roberthsu2004</text>
      <text x="132" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#57606A">/</text>
      <text x="144" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0969DA">Universal_Template_Filler-</text>
      
      <!-- Public 標籤 -->
      <rect x="330" y="2" width="52" height="18" rx="9" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/>
      <text x="356" y="15" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#57606A">Public</text>
    </g>

    <!-- 分頁標籤欄 (Tabs) -->
    <g transform="translate(24, 60)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
      <text x="0" y="14" fill="#57606A">Code</text>
      <text x="50" y="14" fill="#57606A">Issues</text>
      <text x="105" y="14" fill="#57606A">Pull requests</text>
      <text x="200" y="14" fill="#57606A">Actions</text>
      <text x="260" y="14" fill="#57606A">Projects</text>
      <text x="325" y="14" fill="#57606A">Wiki</text>
      <text x="375" y="14" fill="#57606A">Security</text>
      <text x="440" y="14" fill="#57606A">Insights</text>

      <!-- Settings 標籤（選中狀態） -->
      <g transform="translate(505, 0)">
        <text x="0" y="14" font-weight="700" fill="#1F2328">⚙️ Settings</text>
        <!-- 下方紅色底線 -->
        <line x1="-4" y1="24" x2="80" y2="24" stroke="#FD8C73" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- 2. 成功儲存的淡藍色提示條 (Flash message) -->
  <g transform="translate(0, 86)">
    <rect width="960" height="34" fill="#DDF4FF" />
    <text x="24" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#0969DA">GitHub Pages source saved.</text>
    <text x="935" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#57606A">✕</text>
    <line x1="0" y1="34" x2="960" y2="34" stroke="#54AEFF" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- 3. 左側設定選單 (Sidebar) -->
  <g transform="translate(24, 135)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', sans-serif">
    <text x="12" y="16" font-size="13" fill="#57606A">General</text>
    
    <text x="12" y="48" font-size="11" font-weight="700" fill="#57606A">Access</text>
    <text x="24" y="70" font-size="12.5" fill="#57606A">Collaborators</text>

    <text x="12" y="105" font-size="11" font-weight="700" fill="#57606A">Code and automation</text>
    <text x="24" y="128" font-size="12.5" fill="#57606A">Branches</text>
    <text x="24" y="152" font-size="12.5" fill="#57606A">Actions</text>
    <text x="24" y="176" font-size="12.5" fill="#57606A">Webhooks</text>
    <text x="24" y="200" font-size="12.5" fill="#57606A">Environments</text>

    <!-- Pages 選項（選中狀態） -->
    <g transform="translate(0, 218)">
      <!-- 左側藍色豎條 -->
      <rect x="0" y="0" width="3" height="32" rx="1.5" fill="#0969DA" />
      <rect x="6" y="0" width="180" height="32" rx="6" fill="#EAEEF2" />
      <text x="24" y="21" font-size="13" font-weight="700" fill="#1F2328">📄 Pages</text>
    </g>
  </g>

  <!-- 分隔垂直線 -->
  <line x1="225" y1="120" x2="225" y2="550" stroke="#D0D7DE" stroke-width="1" />

  <!-- 4. 右側主要內容區：GitHub Pages 設定 -->
  <g transform="translate(255, 140)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', sans-serif">
    
    <!-- 標題 -->
    <text x="0" y="20" font-size="20" font-weight="700" fill="#1F2328">GitHub Pages</text>
    <text x="0" y="44" font-size="12" fill="#57606A">GitHub Pages is designed to host your personal, organization, or project pages.</text>
    
    <line x1="0" y1="60" x2="680" y2="60" stroke="#D0D7DE" stroke-width="1" />

    <!-- Build and deployment 區塊 -->
    <g transform="translate(0, 75)">
      <text x="0" y="20" font-size="16" font-weight="700" fill="#1F2328">Build and deployment</text>
      <text x="0" y="45" font-size="13" font-weight="600" fill="#1F2328">Source</text>

      <!-- ★ 核心操作焦點：Source 下拉選單 ★ -->
      <g transform="translate(0, 56)">
        <!-- 藍色引導虛線高亮外框 -->
        <rect x="-8" y="-8" width="220" height="54" rx="10" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-dasharray="6,4" />
        
        <!-- 下拉選單按鈕本體 -->
        <rect width="204" height="38" rx="6" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.2" />
        <text x="14" y="24" font-size="13" font-weight="700" fill="#1F2328">GitHub Actions</text>
        <path d="M 180 16 L 185 22 L 190 16" fill="none" stroke="#57606A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- 右側鮮豔指示指引框 -->
        <g transform="translate(230, -5)">
          <rect width="430" height="48" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" />
          <path d="M -8 24 L 0 16 L 0 32 Z" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" />
          <line x1="0" y1="18" x2="0" y2="30" stroke="#EFF6FF" stroke-width="3" />
          <text x="18" y="22" font-size="13" font-weight="800" fill="#1D4ED8">👉 關鍵修復點：將 Source 改選為「GitHub Actions」！</text>
          <text x="18" y="38" font-size="11.5" fill="#2563EB">切換後系統自動儲存，徹底解決「Get Pages site failed」404 報錯！</text>
        </g>
      </g>

      <text x="0" y="125" font-size="11.5" fill="#57606A">Use a suggested workflow, browse all workflows, or create your own.</text>

      <!-- 卡片提示區 -->
      <g transform="translate(0, 145)">
        <rect width="680" height="65" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1" />
        <circle cx="28" cy="32" r="12" fill="#DDF4FF" stroke="#54AEFF" stroke-width="1"/>
        <text x="28" y="37" text-anchor="middle" font-size="12" font-weight="bold" fill="#0969DA">i</text>
        <text x="52" y="28" font-size="12.5" font-weight="600" fill="#1F2328">Workflow details will appear here once your site has been deployed.</text>
        <text x="52" y="48" font-size="11.5" fill="#57606A">當 GitHub Actions 建置完成後，此處將自動產生正式網站網址。</text>
      </g>
    </g>

    <!-- 下一步操作提示橫幅 (Re-run 指引) -->
    <g transform="translate(0, 310)">
      <rect width="680" height="54" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5" />
      <circle cx="28" cy="27" r="10" fill="#10B981" />
      <path d="M 23 27 L 27 31 L 33 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="24" font-size="13" font-weight="800" fill="#065F46">完成設定後的下一步：回到 Actions 分頁點擊「Re-run all jobs」</text>
      <text x="48" y="42" font-size="11.5" fill="#047857">重新跑一次先前失敗的工作流，約 40 秒後即可順利看見綠色勾勾上線！</text>
    </g>

  </g>
</svg>
