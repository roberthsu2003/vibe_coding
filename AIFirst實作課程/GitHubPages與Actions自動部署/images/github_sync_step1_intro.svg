<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 740" width="460" height="740">
  <defs>
    <!-- 陰影效果 -->
    <filter id="cardShadow" x="-5%" y="-3%" width="110%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
    <!-- GitHub 標誌色彩微光 -->
    <radialGradient id="octoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#EC4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 背景面板外框 -->
  <rect width="460" height="740" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- 頂部頁籤列 (Tabs) -->
  <g transform="translate(14, 16)">
    <!-- 返回箭頭 -->
    <path d="M 6 16 L 11 11 M 6 16 L 11 21" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Share -->
    <rect x="22" y="0" width="62" height="32" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="53" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#475569">Share</text>

    <!-- Publish -->
    <rect x="90" y="0" width="68" height="32" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="124" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#475569">Publish</text>

    <!-- Versions -->
    <rect x="164" y="0" width="76" height="32" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="202" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#475569">Versions</text>

    <!-- GitHub (當前選中標籤) -->
    <rect x="246" y="0" width="80" height="32" rx="16" fill="#F1F5F9" stroke="#0F172A" stroke-width="1.5"/>
    <circle cx="258" cy="16" r="3.5" fill="#0F172A" />
    <text x="288" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0F172A">GitHub</text>

    <!-- Integrations -->
    <rect x="332" y="0" width="70" height="32" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="362" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748B">Integrat...</text>

    <!-- 關閉按鈕 X -->
    <path d="M 425 11 L 433 19 M 433 11 L 425 19" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- 面板標題 -->
  <text x="20" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#0F172A">GitHub sync</text>

  <!-- 中心主要視覺：GitHub Octocat 徽章與光暈 -->
  <g transform="translate(0, 40)">
    <text x="230" y="200" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#0F172A">Sync to GitHub</text>

    <!-- 背景彩虹光暈 -->
    <circle cx="230" cy="275" r="75" fill="url(#octoGlow)" />
    <!-- 白色底圓 -->
    <circle cx="230" cy="275" r="48" fill="#FFFFFF" filter="url(#cardShadow)" />
    
    <!-- GitHub Octocat Logo 圖示 -->
    <g transform="translate(208, 253) scale(0.9)">
      <path fill="#24292F" fill-rule="evenodd" d="M24 0C10.74 0 0 10.74 0 24c0 10.61 6.88 19.6 16.42 22.78 1.2.22 1.64-.52 1.64-1.15 0-.57-.02-2.07-.03-4.07-6.68 1.45-8.09-3.22-8.09-3.22-.55-1.39-1.34-1.76-1.34-1.76-2.18-1.49.17-1.46.17-1.46 2.41.17 3.68 2.47 3.68 2.47 2.14 3.67 5.62 2.61 6.99 1.99.22-1.55.84-2.61 1.53-3.21-5.33-.61-10.94-2.67-10.94-11.87 0-2.62.94-4.77 2.47-6.45-.25-.61-1.07-3.05.23-6.36 0 0 2.01-.64 6.6 2.46 1.91-.53 3.97-.8 6.01-.81 2.04.01 4.1.28 6.01.81 4.58-3.1 6.59-2.46 6.59-2.46 1.31 3.31.49 5.75.24 6.36 1.54 1.68 2.47 3.83 2.47 6.45 0 9.22-5.62 11.25-10.97 11.84.86.74 1.63 2.2 1.63 4.44 0 3.21-.03 5.8-.03 6.59 0 .64.43 1.38 1.66 1.15C41.13 43.58 48 34.6 48 24 48 10.74 37.26 0 24 0z"/>
    </g>
  </g>

  <!-- 兩項核心說明 -->
  <g transform="translate(60, 415)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', sans-serif">
    <!-- 說明 1: 建立新倉庫 -->
    <g transform="translate(0, 0)">
      <circle cx="16" cy="16" r="14" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" />
      <path d="M 16 10 L 16 22 M 10 16 L 22 16" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
      <text x="42" y="16" font-size="14" font-weight="600" fill="#334155">A new GitHub repository will be created</text>
      <text x="42" y="34" font-size="12" fill="#64748B">系統將在你的 GitHub 帳號自動建立一個全新儲存庫</text>
    </g>

    <!-- 說明 2: 雙向同步 -->
    <g transform="translate(0, 60)">
      <circle cx="16" cy="16" r="14" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.5" />
      <path d="M 12 14 L 14 11 L 19 11 M 19 11 L 17 9 M 19 11 L 17 13 M 20 18 L 18 21 L 13 21 M 13 21 L 15 19 M 13 21 L 15 23" fill="none" stroke="#16A34A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="42" y="16" font-size="14" font-weight="600" fill="#334155">Changes from Google AI Studio will be synced</text>
      <text x="42" y="34" font-size="12" fill="#64748B">to GitHub, and vice versa（雙向無縫同步最新代碼）</text>
    </g>
  </g>

  <!-- 底部按鈕區 -->
  <g transform="translate(30, 580)">
    <!-- 標記指示框 -->
    <rect x="-8" y="-8" width="416" height="66" rx="28" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6,4" />
    <text x="200" y="-14" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', sans-serif" font-size="12" font-weight="700" fill="#2563EB">👉 第一步：點擊此處啟動儲存庫建立精靈</text>

    <!-- 按鈕實體 -->
    <rect width="400" height="50" rx="25" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="200" y="31" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#0F172A">Create new repository</text>
  </g>

  <!-- 底部提示小標籤 -->
  <g transform="translate(30, 680)">
    <rect width="400" height="38" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="200" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang TC', sans-serif" font-size="12" fill="#64748B">💡 初次使用需先授權 GitHub 帳號連接 Google AI Studio</text>
  </g>
</svg>
