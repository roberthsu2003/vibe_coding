<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雲端智慧庫存管理系統 📊</title>
  <!-- Google Fonts: Outfit & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- CDN 載入 React 18 與 Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- 現代毛玻璃美學 Vanilla CSS 設計系統 -->
  <style>
    :root {
      /* 淺色模式變數 */
      --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
      --bg-blobs: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.05) 0%, transparent 40%),
                  radial-gradient(circle at 90% 80%, rgba(45, 212, 191, 0.05) 0%, transparent 40%);
      --card-bg: rgba(255, 255, 255, 0.75);
      --card-border: rgba(255, 255, 255, 0.6);
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: rgba(226, 232, 240, 0.8);
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-glow: rgba(79, 70, 229, 0.15);
      --accent-green: #0d9488;
      --accent-green-bg: rgba(13, 148, 136, 0.1);
      --accent-amber: #d97706;
      --accent-amber-bg: rgba(217, 119, 6, 0.1);
      --accent-red: #e11d48;
      --accent-red-bg: rgba(225, 29, 72, 0.1);
      --shadow-main: 0 8px 32px 0 rgba(31, 38, 135, 0.06);
      --shadow-hover: 0 12px 40px 0 rgba(31, 38, 135, 0.12);
      --input-bg: rgba(255, 255, 255, 0.9);
      --header-bg: rgba(255, 255, 255, 0.4);
    }

    [data-theme="dark"] {
      /* 深色模式變數 */
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #020617 100%);
      --bg-blobs: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.12) 0%, transparent 45%),
                  radial-gradient(circle at 90% 80%, rgba(45, 212, 191, 0.12) 0%, transparent 45%);
      --card-bg: rgba(30, 41, 59, 0.45);
      --card-border: rgba(255, 255, 255, 0.05);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.06);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-glow: rgba(99, 102, 241, 0.3);
      --accent-green: #2dd4bf;
      --accent-green-bg: rgba(45, 212, 191, 0.12);
      --accent-amber: #fbbf24;
      --accent-amber-bg: rgba(251, 191, 36, 0.12);
      --accent-red: #f43f5e;
      --accent-red-bg: rgba(244, 63, 94, 0.12);
      --shadow-main: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      --shadow-hover: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
      --input-bg: rgba(15, 23, 42, 0.6);
      --header-bg: rgba(15, 23, 42, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', 'Noto Sans TC', sans-serif;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg-blobs);
      z-index: -1;
      pointer-events: none;
    }

    /* 捲軸美化 */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 99px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    /* 毛玻璃容器 */
    .glass-panel {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      box-shadow: var(--shadow-main);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    
    .glass-panel:hover {
      box-shadow: var(--shadow-hover);
    }

    /* 主網頁佈局 */
    .container {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }

    /* 頂部標題與控制列 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 28px;
      margin-bottom: 30px;
      border-radius: 24px;
      background: var(--header-bg);
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-container {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #6366f1 0%, #2dd4bf 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      color: white;
    }

    .brand-title h1 {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, var(--text-main), var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-title p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .controls-section {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* 主題切換按鈕 */
    .theme-toggle, .settings-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-main);
      box-shadow: var(--shadow-main);
    }

    .theme-toggle:hover, .settings-btn:hover {
      transform: scale(1.05);
      border-color: var(--primary);
    }

    /* API 狀態徽章 */
    .api-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      padding: 8px 16px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent-red);
      box-shadow: 0 0 8px var(--accent-red);
    }

    .status-dot.active {
      background-color: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
    }

    /* 數據分析指標網格 */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .kpi-card {
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .kpi-info h3 {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .kpi-info .value {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .kpi-icon-box {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    /* 主區塊雙欄佈局 */
    .main-grid {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 1024px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    /* 表單樣式 */
    .form-container {
      padding: 28px;
      position: sticky;
      top: 24px;
    }

    .form-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      display: flex;
      align-items: center;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .form-input.textarea {
      padding-left: 14px;
      resize: vertical;
      min-height: 80px;
    }

    .form-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* 即時估算微件 */
    .estimate-widget {
      background: var(--border-color);
      border-radius: 14px;
      padding: 14px 16px;
      margin-top: 20px;
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .estimate-row {
      display: flex;
      justify-content: space-between;
      font-weight: 500;
    }

    .estimate-value {
      font-weight: 700;
      color: var(--primary);
    }

    /* Switch 切換按鈕 */
    .switch-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      padding: 10px 0;
    }

    .switch-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .switch-btn {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 26px;
    }

    .switch-btn input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--border-color);
      transition: .3s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent-red);
    }

    input:checked + .slider:before {
      transform: translateX(22px);
    }

    /* 表單提交按鈕 */
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }

    .btn {
      flex: 1;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      outline: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, #4338ca 100%);
      color: white;
      box-shadow: 0 4px 15px var(--primary-glow);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--primary-glow);
    }

    .btn-secondary {
      background: var(--border-color);
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }

    .btn-secondary:hover {
      background: rgba(148, 163, 184, 0.2);
    }

    /* 列表區塊與篩選器 */
    .list-container {
      padding: 24px;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }

    /* 搜尋與篩選列 */
    .search-filter-row {
      display: flex;
      gap: 12px;
      width: 100%;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
    }

    .filter-tabs {
      display: flex;
      background: var(--border-color);
      padding: 4px;
      border-radius: 12px;
      gap: 4px;
    }

    .tab-btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--text-main);
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      font-weight: 600;
    }

    /* 庫存表格樣式 */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      border-radius: 14px;
      border: 1px solid var(--border-color);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.88rem;
    }

    th {
      background: var(--border-color);
      color: var(--text-muted);
      font-weight: 600;
      padding: 14px 18px;
      letter-spacing: 0.5px;
      user-select: none;
      cursor: pointer;
    }

    th:hover {
      color: var(--text-main);
    }

    td {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-main);
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr {
      transition: background-color 0.15s ease;
    }

    tr:hover td {
      background-color: rgba(99, 102, 241, 0.03);
    }

    /* Badges 狀態徽章 */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .badge-success {
      background-color: var(--accent-green-bg);
      color: var(--accent-green);
    }

    .badge-warning {
      background-color: var(--accent-amber-bg);
      color: var(--accent-amber);
      animation: pulse 2s infinite;
    }

    .badge-danger {
      background-color: var(--accent-red-bg);
      color: var(--accent-red);
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.65; }
      100% { opacity: 1; }
    }

    .item-id-badge {
      font-family: 'Outfit', monospace;
      font-weight: 600;
      color: var(--primary);
      background: var(--primary-glow);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    .item-info {
      display: flex;
      flex-direction: column;
      max-width: 240px;
    }

    .item-name {
      font-weight: 600;
      color: var(--text-main);
    }

    .item-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 操作按鈕群 */
    .action-btns {
      display: flex;
      gap: 8px;
    }

    .action-icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s ease;
    }

    .action-icon-btn:hover {
      transform: scale(1.1);
    }

    .action-icon-btn.edit:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--primary-glow);
    }

    .action-icon-btn.delete:hover {
      color: var(--accent-red);
      border-color: var(--accent-red);
      background: var(--accent-red-bg);
    }

    /* 提示與加載動畫 */
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      gap: 16px;
      color: var(--text-muted);
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--border-color);
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--text-muted);
    }

    .empty-state svg {
      color: var(--border-color);
      margin-bottom: 14px;
    }

    /* Floating Toast 訊息提示 */
    .toast-container {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: none;
    }

    .toast {
      min-width: 320px;
      padding: 16px 20px;
      border-radius: 12px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideIn {
      from { transform: translateX(120%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* 彈出對話框 (Modal) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.2s ease;
    }

    .modal {
      width: 90%;
      max-width: 450px;
      padding: 28px;
      border-radius: 20px;
      animation: scaleIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes scaleIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* API 設定對話視窗 */
    .settings-modal {
      max-width: 550px;
    }

    .settings-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 18px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- React 渲染節點 -->
  <div id="root"></div>

  <!-- React 程式碼 (Babel JSX 解析) -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ==========================================
    // 預設與本地儲存的 API 網址設定
    // ==========================================
    const DEFAULT_API_URL = ""; 

    // ==========================================
    // 自訂 SVG 圖標元件 (免除外部 CDN 依賴)
    // ==========================================
    const Icons = {
      Box: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
      ),
      Dollar: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
      ),
      TrendingUp: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline><polyline points="17 6 23 6 23 12"></polyline></svg>
      ),
      AlertTriangle: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
      ),
      Ban: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line></svg>
      ),
      Search: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      ),
      Edit: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4Z"></path></svg>
      ),
      Trash: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
      ),
      Plus: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      ),
      Settings: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      ),
      Sun: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      ),
      Moon: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      ),
      Check: () => (
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
      )
    };

    // ==========================================
    // App 根元件
    // ==========================================
    function App() {
      // 狀態變數
      const [theme, setTheme] = useState("dark");
      const [apiUrl, setApiUrl] = useState(() => {
        return localStorage.getItem("gas_inventory_api_url") || DEFAULT_API_URL;
      });

      const [inventory, setInventory] = useState([]);
      const [loading, setLoading] = useState(false);

      const [searchQuery, setSearchQuery] = useState("");
      const [currentTab, setCurrentTab] = useState("all"); // "all", "reorder", "discontinued", "normal"
      
      // 排序狀態
      const [sortConfig, setSortConfig] = useState({ key: 'id', direction: 'ascending' });

      // 表單狀態
      const [formData, setFormData] = useState({
        id: "",
        name: "",
        description: "",
        price: "",
        quantity: "",
        reorderPoint: "",
        reorderTime: "",
        reorderQty: "",
        discontinued: false
      });
      const [isEditing, setIsEditing] = useState(false);

      // UI 輔助狀態
      const [toasts, setToasts] = useState([]);
      const [deleteTarget, setDeleteTarget] = useState(null); // 用於 custom modal
      const [showSettings, setShowSettings] = useState(false);
      
      // 暫存的設定變數
      const [tempApiUrl, setTempApiUrl] = useState(apiUrl);

      // 主題切換特效
      useEffect(() => {
        document.documentElement.setAttribute("data-theme", theme);
      }, [theme]);

      // 載入資料 (GET)
      const fetchInventory = async (overrideUrl) => {
        const urlToUse = overrideUrl !== undefined ? overrideUrl : apiUrl;
        
        if (!urlToUse) {
          showToast("請點擊右上角設定，輸入後端 API 網址！", "warning");
          return;
        }
        
        setLoading(true);
        try {
          // 為了避免 GAS 快取問題，加上 timestamp 參數
          const response = await fetch(`${urlToUse}?t=${new Date().getTime()}`);
          const json = await response.json();
          
          if (json.status === "success") {
            setInventory(json.data);
            showToast("庫存資料載入成功！", "success");
          } else {
            showToast(`API 回報錯誤: ${json.message}`, "danger");
          }
        } catch (error) {
          console.error("Fetch error:", error);
          showToast("連線失敗！請確認 API 網址是否正確且「誰可以存取」已設為「所有人」。", "danger");
        } finally {
          setLoading(false);
        }
      };

      // 初次加載讀取
      useEffect(() => {
        if (apiUrl) {
          fetchInventory(apiUrl);
        } else {
          setShowSettings(true); // 如果沒網址，自動開啟設定對話框
        }
      }, []);

      // 顯示 Toast 訊息
      const showToast = (message, type = "success") => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 4000);
      };

      // 儲存 API 網址設定
      const handleSaveSettings = () => {
        const formattedUrl = tempApiUrl.trim();
        
        if (formattedUrl && !formattedUrl.startsWith("https://script.google.com/")) {
          showToast("請輸入有效的 Google Apps Script 網頁應用程式網址！", "warning");
          return;
        }

        localStorage.setItem("gas_inventory_api_url", formattedUrl);
        setApiUrl(formattedUrl);
        setShowSettings(false);
        
        showToast("設定已儲存！正在重新連接...", "success");
        fetchInventory(formattedUrl);
      };

      // 即時表單變更
      const handleInputChange = (e) => {
        const { name, value, type, checked } = e.target;
        setFormData(prev => ({
          ...prev,
          [name]: type === 'checkbox' ? checked : value
        }));
      };

      // 表單取消與重設
      const handleResetForm = () => {
        setFormData({
          id: "",
          name: "",
          description: "",
          price: "",
          quantity: "",
          reorderPoint: "",
          reorderTime: "",
          reorderQty: "",
          discontinued: false
        });
        setIsEditing(false);
      };

      // 新增或更新 (POST)
      const handleSubmit = async (e) => {
        e.preventDefault();
        
        if (!apiUrl) {
          showToast("未設定 API 網址，無法提交！", "danger");
          return;
        }

        if (!formData.name.trim()) {
          showToast("請輸入商品名稱！", "warning");
          return;
        }

        setLoading(true);
        const action = isEditing ? "update" : "create";
        
        try {
          await fetch(apiUrl, {
            method: "POST",
            mode: "no-cors", // 重要：處理 GAS 重定向以支援跨網通訊
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              action: action,
              data: {
                id: formData.id,
                name: formData.name.trim(),
                description: formData.description.trim(),
                price: parseFloat(formData.price) || 0,
                quantity: parseFloat(formData.quantity) || 0,
                reorderPoint: parseFloat(formData.reorderPoint) || 0,
                reorderTime: parseFloat(formData.reorderTime) || 0,
                reorderQty: parseFloat(formData.reorderQty) || 0,
                discontinued: formData.discontinued
              }
            })
          });

          showToast(isEditing ? `正在提交修改請求...` : `正在提交新增商品請求...`, "success");
          handleResetForm();
          
          // 延遲 1.5 秒重新拉取，讓後端在 Google Sheets 順利完成寫入
          setTimeout(() => {
            fetchInventory();
          }, 1500);

        } catch (error) {
          console.error("Submit error:", error);
          showToast("發送請求時出錯，請重新嘗試", "danger");
          setLoading(false);
        }
      };

      // 載入商品資料進行編輯
      const handleEdit = (item) => {
        setFormData({
          id: item.id,
          name: item.name,
          description: item.description,
          price: item.price.toString(),
          quantity: item.quantity.toString(),
          reorderPoint: item.reorderPoint.toString(),
          reorderTime: item.reorderTime.toString(),
          reorderQty: item.reorderQty.toString(),
          discontinued: item.discontinued
        });
        setIsEditing(true);
        // 平滑滾動到最上方表單
        window.scrollTo({ top: 0, behavior: 'smooth' });
        showToast(`已載入商品 ${item.id} 編輯資料`, "success");
      };

      // 刪除處理 (呼叫刪除 API)
      const handleDeleteConfirm = async () => {
        if (!deleteTarget) return;
        const idToDelete = deleteTarget;
        setDeleteTarget(null);
        setLoading(true);

        try {
          await fetch(apiUrl, {
            method: "POST",
            mode: "no-cors",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              action: "delete",
              data: { id: idToDelete }
            })
          });

          showToast(`已送出刪除請求，正在移除商品 ${idToDelete}...`, "success");
          
          // 延遲重新讀取
          setTimeout(() => {
            fetchInventory();
          }, 1500);

        } catch (error) {
          console.error("Delete error:", error);
          showToast("刪除失敗，請重新嘗試", "danger");
          setLoading(false);
        }
      };

      // 表格欄位排序邏輯
      const handleRequestSort = (key) => {
        let direction = 'ascending';
        if (sortConfig.key === key && sortConfig.direction === 'ascending') {
          direction = 'descending';
        }
        setSortConfig({ key, direction });
      };

      // 運算即時數據與過濾
      const processedInventory = useMemo(() => {
        let items = [...inventory];

        // 1. 搜尋篩選
        if (searchQuery.trim()) {
          const query = searchQuery.toLowerCase();
          items = items.filter(item => 
            item.name.toLowerCase().includes(query) || 
            item.id.toLowerCase().includes(query) ||
            item.description.toLowerCase().includes(query)
          );
        }

        // 2. 標籤篩選
        if (currentTab === "reorder") {
          items = items.filter(item => item.quantity <= item.reorderPoint && !item.discontinued);
        } else if (currentTab === "discontinued") {
          items = items.filter(item => item.discontinued);
        } else if (currentTab === "normal") {
          items = items.filter(item => item.quantity > item.reorderPoint && !item.discontinued);
        }

        // 3. 排序
        if (sortConfig.key !== null) {
          items.sort((a, b) => {
            let aValue = a[sortConfig.key];
            let bValue = b[sortConfig.key];

            // 確保數字排序正確
            if (typeof aValue === 'number' && typeof bValue === 'number') {
              return sortConfig.direction === 'ascending' ? aValue - bValue : bValue - aValue;
            }

            // 字串比較
            aValue = aValue.toString().toLowerCase();
            bValue = bValue.toString().toLowerCase();
            if (aValue < bValue) {
              return sortConfig.direction === 'ascending' ? -1 : 1;
            }
            if (aValue > bValue) {
              return sortConfig.direction === 'ascending' ? 1 : -1;
            }
            return 0;
          });
        }

        return items;
      }, [inventory, searchQuery, currentTab, sortConfig]);

      // 指標計算
      const kpis = useMemo(() => {
        const totalItems = inventory.length;
        const totalValue = inventory.reduce((sum, item) => sum + (item.price * item.quantity), 0);
        const reorderAlerts = inventory.filter(item => item.quantity <= item.reorderPoint && !item.discontinued).length;
        const discontinuedCount = inventory.filter(item => item.discontinued).length;

        return {
          totalItems,
          totalValue,
          reorderAlerts,
          discontinuedCount
        };
      }, [inventory]);

      // 即時表單狀態評估 (輸入時即時更新)
      const formAssessment = useMemo(() => {
        const price = parseFloat(formData.price) || 0;
        const quantity = parseFloat(formData.quantity) || 0;
        const reorderPoint = parseFloat(formData.reorderPoint) || 0;
        const value = price * quantity;
        const isLow = quantity <= reorderPoint && quantity !== 0;

        return {
          value,
          isLow
        };
      }, [formData.price, formData.quantity, formData.reorderPoint]);

      return (
        <div className="container">
          {/* Header 區塊 */}
          <header className="glass-panel">
            <div className="brand-section">
              <div className="logo-container">
                <Icons.Box />
              </div>
              <div className="brand-title">
                <h1>雲端智慧庫存系統</h1>
                <p>Google Apps Script 即時後台資料庫驅動</p>
              </div>
            </div>
            
            <div className="controls-section">
              {/* API 狀態徽章 */}
              <div className="api-status">
                <div className={`status-dot ${apiUrl ? 'active' : ''}`}></div>
                <span>{apiUrl ? 'API 已連線' : 'API 未設定'}</span>
              </div>

              {/* 設定按鈕 */}
              <button className="settings-btn" onClick={() => { setTempApiUrl(apiUrl); setShowSettings(true); }} title="後端 API 設定">
                <Icons.Settings />
              </button>

              {/* 主題切換 */}
              <button className="theme-toggle" onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} title="切換主題">
                {theme === 'dark' ? <Icons.Sun /> : <Icons.Moon />}
              </button>
            </div>
          </header>

          {/* KPI 儀表板區塊 */}
          <section className="kpi-grid">
            <div className="glass-panel kpi-card">
              <div className="kpi-info">
                <h3>總庫存品項數</h3>
                <div className="value">{kpis.totalItems}</div>
              </div>
              <div className="kpi-icon-box" style={{ background: 'linear-gradient(135deg, #6366f1, #4f46e5)' }}>
                <Icons.Box />
              </div>
            </div>

            <div className="glass-panel kpi-card">
              <div className="kpi-info">
                <h3>庫存資產總價值</h3>
                <div className="value">NT$ {kpis.totalValue.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 0 })}</div>
              </div>
              <div className="kpi-icon-box" style={{ background: 'linear-gradient(135deg, #10b981, #059669)' }}>
                <Icons.Dollar />
              </div>
            </div>

            <div className="glass-panel kpi-card" style={{ border: kpis.reorderAlerts > 0 ? '1px solid rgba(251, 191, 36, 0.4)' : '' }}>
              <div className="kpi-info">
                <h3>安全庫存補貨警示</h3>
                <div className="value" style={{ color: kpis.reorderAlerts > 0 ? 'var(--accent-amber)' : 'inherit' }}>
                  {kpis.reorderAlerts} <span style={{ fontSize: '1rem', fontWeight: 500 }}>項需補貨</span>
                </div>
              </div>
              <div className="kpi-icon-box" style={{ background: kpis.reorderAlerts > 0 ? 'linear-gradient(135deg, #f59e0b, #d97706)' : 'linear-gradient(135deg, #94a3b8, #64748b)' }}>
                <Icons.AlertTriangle />
              </div>
            </div>

            <div className="glass-panel kpi-card">
              <div className="kpi-info">
                <h3>停產商品項目</h3>
                <div className="value">{kpis.discontinuedCount}</div>
              </div>
              <div className="kpi-icon-box" style={{ background: 'linear-gradient(135deg, #f43f5e, #e11d48)' }}>
                <Icons.Ban />
              </div>
            </div>
          </section>

          {/* 主格柵佈局 (表單 + 列表) */}
          <main className="main-grid">
            
            {/* 左側表單 (新增 / 編輯) */}
            <section className="glass-panel form-container">
              <div className="form-title" style={{ color: isEditing ? 'var(--primary)' : 'inherit' }}>
                {isEditing ? <Icons.Edit /> : <Icons.Plus />}
                <span>{isEditing ? `編輯庫存商品 (${formData.id})` : "新增庫存商品"}</span>
              </div>

              <form onSubmit={handleSubmit}>
                <div className="form-group">
                  <label htmlFor="name">商品名稱 *</label>
                  <div className="input-wrapper">
                    <div className="input-icon">📦</div>
                    <input 
                      type="text" 
                      id="name" 
                      name="name" 
                      className="form-input" 
                      placeholder="例如: 電子天平"
                      value={formData.name}
                      onChange={handleInputChange}
                      required
                    />
                  </div>
                </div>

                <div className="form-group">
                  <label htmlFor="description">商品規格描述</label>
                  <textarea 
                    id="description" 
                    name="description" 
                    className="form-input textarea" 
                    placeholder="輸入詳細規格、包裝、用途等..."
                    value={formData.description}
                    onChange={handleInputChange}
                  />
                </div>

                <div className="form-row-2">
                  <div className="form-group">
                    <label htmlFor="price">單價 (NT$) *</label>
                    <div className="input-wrapper">
                      <div className="input-icon">💵</div>
                      <input 
                        type="number" 
                        id="price" 
                        name="price" 
                        min="0"
                        step="0.01"
                        className="form-input" 
                        placeholder="0.00"
                        value={formData.price}
                        onChange={handleInputChange}
                        required
                      />
                    </div>
                  </div>

                  <div className="form-group">
                    <label htmlFor="quantity">庫存數量 *</label>
                    <div className="input-wrapper">
                      <div className="input-icon">🔢</div>
                      <input 
                        type="number" 
                        id="quantity" 
                        name="quantity" 
                        min="0"
                        step="any"
                        className="form-input" 
                        placeholder="0"
                        value={formData.quantity}
                        onChange={handleInputChange}
                        required
                      />
                    </div>
                  </div>
                </div>

                <div className="form-row-2">
                  <div className="form-group">
                    <label htmlFor="reorderPoint">再訂貨點 (安全存量) *</label>
                    <div className="input-wrapper">
                      <div className="input-icon">⚠️</div>
                      <input 
                        type="number" 
                        id="reorderPoint" 
                        name="reorderPoint" 
                        min="0"
                        className="form-input" 
                        placeholder="5"
                        value={formData.reorderPoint}
                        onChange={handleInputChange}
                        required
                      />
                    </div>
                  </div>

                  <div className="form-group">
                    <label htmlFor="reorderQty">每次再訂貨數量 *</label>
                    <div className="input-wrapper">
                      <div className="input-icon">🚚</div>
                      <input 
                        type="number" 
                        id="reorderQty" 
                        name="reorderQty" 
                        min="0"
                        className="form-input" 
                        placeholder="10"
                        value={formData.reorderQty}
                        onChange={handleInputChange}
                        required
                      />
                    </div>
                  </div>
                </div>

                <div className="form-group">
                  <label htmlFor="reorderTime">補貨時間 (天)</label>
                  <div className="input-wrapper">
                    <div className="input-icon">⏳</div>
                    <input 
                      type="number" 
                      id="reorderTime" 
                      name="reorderTime" 
                      min="0"
                      className="form-input" 
                      placeholder="補貨需要幾天送達"
                      value={formData.reorderTime}
                      onChange={handleInputChange}
                    />
                  </div>
                </div>

                {/* 是否停產 Switch */}
                <div className="switch-group">
                  <span className="switch-label">此商品是否已停產？</span>
                  <label className="switch-btn">
                    <input 
                      type="checkbox" 
                      name="discontinued"
                      checked={formData.discontinued}
                      onChange={handleInputChange}
                    />
                    <span className="slider"></span>
                  </label>
                </div>

                {/* 即時計算面板 */}
                {(formData.price || formData.quantity) && (
                  <div className="estimate-widget">
                    <div className="estimate-row">
                      <span>預估庫存價值:</span>
                      <span className="estimate-value">NT$ {formAssessment.value.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 })}</span>
                    </div>
                    {formAssessment.isLow && (
                      <div className="estimate-row" style={{ color: 'var(--accent-amber)', fontSize: '0.8rem', marginTop: '4px', fontWeight: 'bold' }}>
                        <span>⚠️ 警示:</span>
                        <span>庫存量已低於安全存量！</span>
                      </div>
                    )}
                  </div>
                )}

                <div className="btn-group">
                  <button type="submit" className="btn btn-primary" disabled={loading}>
                    <Icons.Check />
                    <span>{isEditing ? "儲存更新" : "確認新增"}</span>
                  </button>
                  {(isEditing || formData.name || formData.price || formData.quantity) && (
                    <button type="button" className="btn btn-secondary" onClick={handleResetForm} disabled={loading}>
                      <span>重設</span>
                    </button>
                  )}
                </div>
              </form>
            </section>

            {/* 右側商品列表與篩選 */}
            <section className="glass-panel list-container">
              <div className="list-header">
                {/* 搜尋與篩選分頁 */}
                <div className="search-filter-row">
                  <div className="input-wrapper search-box">
                    <div className="input-icon"><Icons.Search /></div>
                    <input 
                      type="text" 
                      className="form-input" 
                      placeholder="搜尋庫存 ID、商品名稱、規格描述..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                    />
                  </div>
                  
                  <div className="filter-tabs">
                    <button 
                      className={`tab-btn ${currentTab === 'all' ? 'active' : ''}`}
                      onClick={() => setCurrentTab('all')}
                    >
                      全部品項
                    </button>
                    <button 
                      className={`tab-btn ${currentTab === 'normal' ? 'active' : ''}`}
                      onClick={() => setCurrentTab('normal')}
                    >
                      充足 ✅
                    </button>
                    <button 
                      className={`tab-btn ${currentTab === 'reorder' ? 'active' : ''}`}
                      onClick={() => setCurrentTab('reorder')}
                    >
                      需補貨 ⚠️
                    </button>
                    <button 
                      className={`tab-btn ${currentTab === 'discontinued' ? 'active' : ''}`}
                      onClick={() => setCurrentTab('discontinued')}
                    >
                      已停產 🚫
                    </button>
                  </div>
                </div>
              </div>

              {/* 列表內容 */}
              {loading && processedInventory.length === 0 ? (
                <div className="loading-container">
                  <div className="spinner"></div>
                  <p>正在與 Google Sheets 後端同步中...</p>
                </div>
              ) : processedInventory.length === 0 ? (
                <div className="empty-state">
                  <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1" strokeLinecap="round" strokeLinejoin="round" style={{opacity: 0.3}}><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
                  <p style={{fontSize: '1.05rem', fontWeight: 500, marginBottom: '6px'}}>找不到符合的庫存項目</p>
                  <p style={{fontSize: '0.85rem'}}>請點擊左側新增商品，或者檢查 API 連線設定！</p>
                  {!apiUrl && (
                    <button 
                      className="btn btn-primary" 
                      style={{maxWidth: '180px', margin: '20px auto 0'}}
                      onClick={() => setShowSettings(true)}
                    >
                      設定 API 網址
                    </button>
                  )}
                </div>
              ) : (
                <div className="table-responsive">
                  <table>
                    <thead>
                      <tr>
                        <th onClick={() => handleRequestSort('needReorder')}>狀態</th>
                        <th onClick={() => handleRequestSort('id')}>ID</th>
                        <th onClick={() => handleRequestSort('name')}>商品資訊</th>
                        <th onClick={() => handleRequestSort('price')} style={{textAlign: 'right'}}>單價</th>
                        <th onClick={() => handleRequestSort('quantity')} style={{textAlign: 'right'}}>數量</th>
                        <th onClick={() => handleRequestSort('value')} style={{textAlign: 'right'}}>總市值</th>
                        <th onClick={() => handleRequestSort('reorderPoint')} style={{textAlign: 'right'}}>補貨警示點</th>
                        <th>操作</th>
                      </tr>
                    </thead>
                    <tbody>
                      {processedInventory.map((item) => {
                        return (
                          <tr key={item.id} style={{ opacity: item.discontinued ? 0.65 : 1 }}>
                            {/* 狀態標籤 */}
                            <td>
                              {item.discontinued ? (
                                <span className="badge badge-danger">已停產 🚫</span>
                              ) : item.needReorder ? (
                                <span className="badge badge-warning">需補貨 ⚠️</span>
                              ) : (
                                <span className="badge badge-success">正常供應 ✅</span>
                              )}
                            </td>
                            {/* ID */}
                            <td>
                              <span className="item-id-badge">{item.id}</span>
                            </td>
                            {/* 商品資訊 */}
                            <td>
                              <div className="item-info">
                                <span className="item-name">{item.name}</span>
                                {item.description && <span className="item-desc" title={item.description}>{item.description}</span>}
                              </div>
                            </td>
                            {/* 單價 */}
                            <td style={{textAlign: 'right', fontWeight: 500}}>
                              NT$ {item.price.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 })}
                            </td>
                            {/* 庫存數量 */}
                            <td style={{textAlign: 'right', fontWeight: 600, color: item.needReorder && !item.discontinued ? 'var(--accent-amber)' : 'inherit'}}>
                              {item.quantity.toLocaleString()}
                            </td>
                            {/* 總價值 */}
                            <td style={{textAlign: 'right', fontWeight: 700, color: 'var(--primary)'}}>
                              NT$ {item.value.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 0 })}
                            </td>
                            {/* 補貨點 */}
                            <td style={{textAlign: 'right', color: 'var(--text-muted)'}}>
                              {item.reorderPoint} (每次補 {item.reorderQty})
                            </td>
                            {/* 操作 */}
                            <td>
                              <div className="action-btns">
                                <button 
                                  className="action-icon-btn edit" 
                                  onClick={() => handleEdit(item)}
                                  title="修改品項"
                                >
                                  <Icons.Edit />
                                </button>
                                <button 
                                  className="action-icon-btn delete" 
                                  onClick={() => setDeleteTarget(item.id)}
                                  title="刪除品項"
                                >
                                  <Icons.Trash />
                                </button>
                              </div>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              )}
            </section>
          </main>

          {/* Floating Toast Alerts 區域 */}
          <div className="toast-container">
            {toasts.map(t => (
              <div key={t.id} className="toast">
                {t.type === 'success' && <div className="status-dot active"></div>}
                {t.type === 'warning' && <div className="status-dot" style={{backgroundColor: 'var(--accent-amber)', boxShadow: '0 0 8px var(--accent-amber)'}}></div>}
                {t.type === 'danger' && <div className="status-dot"></div>}
                <span>{t.message}</span>
              </div>
            ))}
          </div>

          {/* Custom Delete Confirmation Modal */}
          {deleteTarget && (
            <div className="modal-overlay">
              <div className="glass-panel modal">
                <h3 style={{fontSize: '1.2rem', fontWeight: 700, marginBottom: '12px', color: 'var(--accent-red)', display: 'flex', alignItems: 'center', gap: '8px'}}>
                  <Icons.AlertTriangle />
                  確定要刪除此庫存品項？
                </h3>
                <p style={{color: 'var(--text-muted)', fontSize: '0.9rem', marginBottom: '24px', lineHeight: 1.5}}>
                  您即將從資料庫中永久刪除商品編號 <strong style={{color: 'var(--text-main)'}}>{deleteTarget}</strong> 的所有庫存資料。此操作將會直接同步修改 Google Sheets 且無法還原。
                </p>
                <div className="btn-group">
                  <button className="btn btn-secondary" onClick={() => setDeleteTarget(null)}>取消</button>
                  <button 
                    className="btn btn-primary" 
                    style={{background: 'linear-gradient(135deg, var(--accent-red) 0%, #be123c 100%)', boxShadow: '0 4px 15px rgba(225,29,72,0.2)'}}
                    onClick={handleDeleteConfirm}
                  >
                    確定刪除
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Settings Modal (API 網址設定) */}
          {showSettings && (
            <div className="modal-overlay">
              <div className="glass-panel modal settings-modal">
                <h3 style={{fontSize: '1.2rem', fontWeight: 700, marginBottom: '12px', display: 'flex', alignItems: 'center', gap: '8px'}}>
                  <Icons.Settings />
                  後端 Google Apps Script API 設定
                </h3>
                <p className="settings-desc">
                  本系統使用 Google Apps Script (GAS) 作為 API 後端資料庫，讀寫您的 Google Sheets 中的庫存資料。請輸入您部署成功的<strong>「網頁應用程式網址」</strong>：
                </p>
                
                <div className="form-group" style={{marginBottom: '20px'}}>
                  <label htmlFor="settingsUrl">網頁應用程式網址 (Web App URL)</label>
                  <input 
                    type="url" 
                    id="settingsUrl" 
                    className="form-input" 
                    style={{paddingLeft: '14px'}}
                    placeholder="https://script.google.com/macros/s/.../exec"
                    value={tempApiUrl}
                    onChange={(e) => setTempApiUrl(e.target.value)}
                  />
                </div>

                <div style={{background: 'var(--border-color)', padding: '14px', borderRadius: '12px', fontSize: '0.8rem', color: 'var(--text-muted)', lineHeight: 1.5, marginBottom: '24px'}}>
                  <strong style={{color: 'var(--text-main)'}}>⚠️ 部署小提示：</strong>
                  <ol style={{paddingLeft: '18px', marginTop: '6px', display: 'flex', flexDirection: 'column', gap: '4px'}}>
                    <li>在 GAS 部署時，<strong>「執行身分」</strong>選擇「我」，且<strong>「誰可以存取」</strong>必須選擇<strong>「所有人」</strong>。</li>
                    <li>每次在 Apps Script 修改代碼後，都必須進入「管理部署作業」中選擇<strong>「建立新版本」</strong>重新部署，修改才會生效。</li>
                  </ol>
                </div>

                <div className="btn-group">
                  <button className="btn btn-secondary" onClick={() => { if(apiUrl) setShowSettings(false); else showToast("必須設定 API 網址才能使用系統功能！", "warning"); }}>取消</button>
                  <button className="btn btn-primary" onClick={handleSaveSettings}>
                    <Icons.Check />
                    儲存並連接
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Footer 頁尾資訊 */}
          <footer style={{textAlign: 'center', padding: '30px 20px', color: 'var(--text-muted)', fontSize: '0.8rem', marginTop: 'auto'}}>
            <p>© 2026 AI-First Web 實作課程 - 雲端智慧庫存管理系統</p>
            <p style={{marginTop: '6px', fontSize: '0.75rem', opacity: 0.7}}>Made with React & Google Apps Script API</p>
          </footer>
        </div>
      );
    }

    // 渲染 React 應用
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
