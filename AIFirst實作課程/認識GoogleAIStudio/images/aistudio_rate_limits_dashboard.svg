<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="100%" height="100%">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .bg-sidebar { fill: #FAFAFA; }
      .text-title { font-size: 20px; font-weight: 700; fill: #1E293B; }
      .text-subtitle { font-size: 12px; fill: #64748B; }
      .text-body { font-size: 13px; fill: #334155; }
      .text-bold { font-weight: 600; }
      .text-dim { font-size: 12px; fill: #94A3B8; }
      .border-line { stroke: #E2E8F0; stroke-width: 1; }
      .card-bg { fill: #FFFFFF; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.04)); }
    </style>
    
    <!-- 陰影濾鏡 -->
    <filter id="shadow-sm" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- 整體背景 -->
  <rect width="1100" height="640" rx="12" fill="#FFFFFF"/>
  <rect width="1100" height="640" rx="12" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- 左側側邊欄 -->
  <rect x="0" y="0" width="200" height="640" rx="12" fill="#F8FAFC"/>
  <path d="M 200 0 L 200 640" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Logo 區 -->
  <g transform="translate(18, 20)">
    <!-- Google AI Studio Logo 文字 -->
    <text x="0" y="16" class="font-sans text-bold" font-size="15" fill="#0F172A">Google AI Studio</text>
    <path d="M 152 7 L 166 7 M 152 12 L 166 12 M 152 17 L 160 17" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- < Dashboard -->
  <g transform="translate(18, 64)">
    <path d="M 4 8 L 0 4 L 4 0" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="12" y="6" class="font-sans" font-size="13" fill="#475569">Dashboard</text>
  </g>

  <!-- 側邊選單：PROJECT -->
  <g transform="translate(18, 105)">
    <text x="0" y="0" class="font-sans text-bold" font-size="10" fill="#94A3B8" letter-spacing="0.5">PROJECT</text>
    
    <!-- API Keys -->
    <g transform="translate(0, 16)">
      <path d="M 2 8 A 4 4 0 1 1 8 5 L 14 5 L 14 7 L 12 7 L 12 9 L 10 9 L 10 8 Z" fill="none" stroke="#64748B" stroke-width="1.2"/>
      <text x="20" y="8" class="font-sans" font-size="12.5" fill="#475569">API Keys</text>
    </g>

    <!-- Projects -->
    <g transform="translate(0, 42)">
      <path d="M 1 3 L 6 3 L 8 5 L 15 5 L 15 13 L 1 13 Z" fill="none" stroke="#64748B" stroke-width="1.2"/>
      <text x="20" y="8" class="font-sans" font-size="12.5" fill="#475569">Projects</text>
    </g>
  </g>

  <!-- 側邊選單：USAGE & BILLING -->
  <g transform="translate(18, 185)">
    <text x="0" y="0" class="font-sans text-bold" font-size="10" fill="#94A3B8" letter-spacing="0.5">USAGE &amp; BILLING</text>
    
    <!-- Usage -->
    <g transform="translate(0, 16)">
      <path d="M 2 12 L 2 6 M 6 12 L 6 2 M 10 12 L 10 8 M 14 12 L 14 4" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
      <text x="20" y="8" class="font-sans" font-size="12.5" fill="#475569">Usage</text>
    </g>

    <!-- Rate Limit (選中高亮狀態) -->
    <g transform="translate(-10, 40)">
      <rect x="0" y="0" width="184" height="32" rx="6" fill="#E2E8F0"/>
      <path d="M 12 19 A 6 6 0 1 1 20 19 L 16 14 Z" fill="none" stroke="#0F172A" stroke-width="1.5" stroke-linejoin="round"/>
      <text x="30" y="20" class="font-sans text-bold" font-size="12.5" fill="#0F172A">Rate Limit</text>
      <!-- 指標箭頭 -->
      <polygon points="172,16 177,13 177,19" fill="#0F172A"/>
    </g>

    <!-- Spend -->
    <g transform="translate(0, 84)">
      <circle cx="7" cy="7" r="6" fill="none" stroke="#64748B" stroke-width="1.2"/>
      <text x="7" y="10" font-size="9" text-anchor="middle" fill="#64748B" class="font-sans text-bold">$</text>
      <text x="20" y="8" class="font-sans" font-size="12.5" fill="#475569">Spend</text>
    </g>

    <!-- Billing -->
    <g transform="translate(0, 110)">
      <rect x="2" y="2" width="12" height="10" rx="1" fill="none" stroke="#64748B" stroke-width="1.2"/>
      <path d="M 2 5 L 14 5" stroke="#64748B" stroke-width="1.2"/>
      <text x="20" y="8" class="font-sans" font-size="12.5" fill="#475569">Billing</text>
    </g>
  </g>

  <!-- 側邊選單：OBSERVE -->
  <g transform="translate(18, 335)">
    <text x="0" y="0" class="font-sans text-bold" font-size="10" fill="#94A3B8" letter-spacing="0.5">OBSERVE</text>
    <g transform="translate(0, 16)">
      <ellipse cx="8" cy="4" rx="6" ry="2" fill="none" stroke="#64748B" stroke-width="1.2"/>
      <path d="M 2 4 L 2 10 A 6 2 0 0 0 14 10 L 14 4" fill="none" stroke="#64748B" stroke-width="1.2"/>
      <text x="20" y="8" class="font-sans" font-size="12.5" fill="#475569">Logs and Datasets</text>
    </g>
  </g>

  <!-- 側邊底部 Changelog -->
  <g transform="translate(18, 605)">
    <text x="0" y="0" class="font-sans" font-size="12" fill="#64748B">Changelog ↗</text>
  </g>


  <!-- ================= 主內容區塊 ================= -->
  <g transform="translate(230, 24)">
    
    <!-- 頂部標題列 -->
    <text x="0" y="22" class="font-sans text-bold text-title">Gemini API Rate Limit</text>
    
    <!-- Free tier 膠囊徽章 -->
    <rect x="238" y="6" width="68" height="22" rx="11" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="248" cy="17" r="2.5" fill="#64748B"/>
    <text x="256" y="21" class="font-sans" font-size="11" fill="#475569">Free tier</text>

    <!-- 右上角按鈕：Docs & Set up billing -->
    <g transform="translate(680, 4)">
      <path d="M 4 3 L 11 3 L 14 6 L 14 15 L 4 15 Z" fill="none" stroke="#475569" stroke-width="1.2"/>
      <text x="18" y="13" class="font-sans" font-size="12" fill="#475569">Docs</text>
      
      <rect x="65" y="-4" width="95" height="28" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
      <text x="112" y="14" class="font-sans text-bold" font-size="11.5" fill="#1E293B" text-anchor="middle">Set up billing</text>
    </g>

    <!-- 篩選列：Project & Time Range -->
    <g transform="translate(0, 52)">
      <text x="0" y="17" class="font-sans" font-size="12" fill="#64748B">Project</text>
      <rect x="46" y="0" width="160" height="28" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="58" y="18" class="font-sans" font-size="12" fill="#1E293B">Default Gemini Project</text>
      <path d="M 190 12 L 194 16 L 198 12" fill="none" stroke="#64748B" stroke-width="1.2"/>

      <text x="225" y="17" class="font-sans" font-size="12" fill="#64748B">Time Range</text>
      <rect x="296" y="0" width="105" height="28" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="308" y="18" class="font-sans" font-size="12" fill="#1E293B">28 Days</text>
      <path d="M 386 12 L 390 16 L 394 12" fill="none" stroke="#64748B" stroke-width="1.2"/>
    </g>

    <!-- ⚠️ 警示卡片 Alert Box -->
    <g transform="translate(0, 95)">
      <rect x="0" y="0" width="840" height="74" rx="8" fill="#FFF5F5" stroke="#FCA5A5" stroke-width="1"/>
      
      <!-- 紅色驚嘆號圖示 -->
      <circle cx="24" cy="24" r="8" fill="none" stroke="#DC2626" stroke-width="1.5"/>
      <text x="24" y="28" class="font-sans text-bold" font-size="12" fill="#DC2626" text-anchor="middle">!</text>
      
      <text x="42" y="27" class="font-sans text-bold" font-size="13" fill="#B91C1C">
        You have reached a rate limit. Set up billing to increase your limits and unblock your work.
      </text>

      <!-- 叉叉 -->
      <path d="M 816 18 L 824 26 M 824 18 L 816 26" stroke="#94A3B8" stroke-width="1.5"/>

      <!-- 下方按鈕 -->
      <text x="42" y="55" class="font-sans text-bold" font-size="12" fill="#1E293B">Learn more</text>
      
      <rect x="125" y="38" width="100" height="26" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="175" y="55" class="font-sans text-bold" font-size="11.5" fill="#1E293B" text-anchor="middle">Set up billing</text>
    </g>

    <!-- 列表標題與切換 -->
    <g transform="translate(0, 190)">
      <text x="0" y="14" class="font-sans text-bold" font-size="15" fill="#1E293B">Rate limits by model</text>
      <circle cx="152" cy="9" r="6" fill="none" stroke="#94A3B8" stroke-width="1"/>
      <text x="152" y="12" font-size="9" fill="#94A3B8" text-anchor="middle" class="font-sans">i</text>
      
      <text x="0" y="34" class="font-sans" font-size="12" fill="#64748B">Peak usage per model compared to its limit over the last 28 days</text>

      <!-- 右側切換控制項 -->
      <g transform="translate(620, 0)">
        <rect x="0" y="3" width="28" height="16" rx="8" fill="#CBD5E1"/>
        <circle cx="8" cy="11" r="6" fill="#FFFFFF"/>
        <text x="35" y="16" class="font-sans" font-size="12" fill="#475569">All models</text>

        <rect x="110" y="-3" width="110" height="28" rx="14" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
        <text x="158" y="15" class="font-sans" font-size="11.5" fill="#334155" text-anchor="middle">Compare tiers ⌄</text>
      </g>
    </g>

    <!-- 表格區塊 -->
    <g transform="translate(0, 240)">
      <!-- 表頭 -->
      <rect x="0" y="0" width="840" height="32" fill="#F8FAFC"/>
      <path d="M 0 32 L 840 32" stroke="#E2E8F0" stroke-width="1"/>
      
      <text x="12" y="20" class="font-sans text-bold" font-size="12" fill="#64748B">Model</text>
      <text x="240" y="20" class="font-sans text-bold" font-size="12" fill="#64748B">Category</text>
      <text x="400" y="20" class="font-sans text-bold" font-size="12" fill="#64748B">RPM ↓</text>
      <text x="560" y="20" class="font-sans text-bold" font-size="12" fill="#64748B">TPM</text>
      <text x="710" y="20" class="font-sans text-bold" font-size="12" fill="#64748B">RPD</text>

      <!-- 第 1 列：Gemini 3.8 Flash (真實超標數值) -->
      <g transform="translate(0, 32)">
        <rect x="0" y="0" width="840" height="48" fill="#FFFDFD"/>
        <path d="M 0 48 L 840 48" stroke="#F1F5F9" stroke-width="1"/>

        <!-- Model -->
        <text x="12" y="28" class="font-sans text-bold" font-size="13" fill="#0F172A">Gemini 3.8 Flash</text>
        
        <!-- Category -->
        <text x="240" y="28" class="font-sans" font-size="12" fill="#64748B">Text-out models</text>
        
        <!-- RPM (4 / 5 - 橙色警告) -->
        <g transform="translate(400, 20)">
          <!-- 底槽 -->
          <rect x="0" y="2" width="45" height="5" rx="2.5" fill="#E2E8F0"/>
          <!-- 橙色進度 4/5 = 80% -->
          <rect x="0" y="2" width="36" height="5" rx="2.5" fill="#D97706"/>
          <text x="52" y="8" class="font-sans text-bold" font-size="12" fill="#D97706">4 / 5</text>
        </g>

        <!-- TPM (20.46K / 250K) -->
        <g transform="translate(560, 20)">
          <!-- 底槽 -->
          <rect x="0" y="2" width="55" height="5" rx="2.5" fill="#E2E8F0"/>
          <!-- 灰色進度 20K/250K = 8% -->
          <circle cx="5" cy="4.5" r="3" fill="#64748B"/>
          <text x="64" y="8" class="font-sans" font-size="11.5" fill="#64748B">20.46K / 250K</text>
        </g>

        <!-- RPD (22 / 20 - 紅色超額爆表！🚨) -->
        <g transform="translate(710, 20)">
          <!-- 底槽 -->
          <rect x="0" y="2" width="45" height="5" rx="2.5" fill="#FEE2E2"/>
          <!-- 紅色進度 22/20 = 100% 爆滿 -->
          <rect x="0" y="2" width="45" height="5" rx="2.5" fill="#DC2626"/>
          <text x="52" y="8" class="font-sans text-bold" font-size="12" fill="#DC2626">22 / 20 ⚠️</text>
        </g>
      </g>

      <!-- 第 2 列：Antigravity -->
      <g transform="translate(0, 80)">
        <rect x="0" y="0" width="840" height="42" fill="#FFFFFF"/>
        <path d="M 0 42 L 840 42" stroke="#F1F5F9" stroke-width="1"/>

        <text x="12" y="26" class="font-sans" font-size="13" fill="#475569">Antigravity</text>
        <text x="240" y="26" class="font-sans" font-size="12" fill="#94A3B8">Agents</text>

        <!-- RPM (0 / 60) -->
        <g transform="translate(400, 18)">
          <rect x="0" y="2" width="45" height="5" rx="2.5" fill="#F1F5F9"/>
          <text x="52" y="8" class="font-sans" font-size="11.5" fill="#94A3B8">0 / 60</text>
        </g>

        <!-- TPM (0 / 100K) -->
        <g transform="translate(560, 18)">
          <rect x="0" y="2" width="55" height="5" rx="2.5" fill="#F1F5F9"/>
          <text x="64" y="8" class="font-sans" font-size="11.5" fill="#94A3B8">0 / 100K</text>
        </g>

        <!-- RPD (0 / 100) -->
        <g transform="translate(710, 18)">
          <rect x="0" y="2" width="45" height="5" rx="2.5" fill="#F1F5F9"/>
          <text x="52" y="8" class="font-sans" font-size="11.5" fill="#94A3B8">0 / 100</text>
        </g>
      </g>

      <!-- See more ⌄ -->
      <text x="420" y="145" class="font-sans" font-size="12" fill="#64748B" text-anchor="middle">See more ⌄</text>
    </g>

    <!-- 底部解析標註卡片 (Callout Box) -->
    <g transform="translate(0, 435)">
      <rect x="0" y="0" width="840" height="150" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="4 3"/>
      
      <text x="18" y="24" class="font-sans text-bold" font-size="13" fill="#0F172A">🔍 Google AI Studio 免費額度關鍵解讀（從真實後台數據）：</text>
      
      <g transform="translate(18, 42)">
        <circle cx="4" cy="5" r="3" fill="#D97706"/>
        <text x="14" y="9" class="font-sans text-bold" font-size="12.5" fill="#1E293B">RPM (每分鐘請求數) 上限僅 5 次：</text>
        <text x="240" y="9" class="font-sans" font-size="12" fill="#475569">當前消耗 4 / 5，短時間內發送多個 Prompt 就會逼近上限。</text>
      </g>

      <g transform="translate(18, 68)">
        <circle cx="4" cy="5" r="3" fill="#64748B"/>
        <text x="14" y="9" class="font-sans text-bold" font-size="12.5" fill="#1E293B">TPM (每分鐘 Token 數) 上限 250K：</text>
        <text x="240" y="9" class="font-sans" font-size="12" fill="#475569">目前消耗 20.46K / 250K，讀寫整個前端代碼庫時需注意 Token 累積。</text>
      </g>

      <g transform="translate(18, 94)">
        <circle cx="4" cy="5" r="3" fill="#DC2626"/>
        <text x="14" y="9" class="font-sans text-bold" font-size="12.5" fill="#DC2626">RPD (每日總請求數) 上限僅 20 次（🚨 爆表主因）：</text>
        <text x="315" y="9" class="font-sans" font-size="12" fill="#B91C1C">目前為 22 / 20，因此觸發「Quota exceeded」！需等到美西午夜重置或綁卡解除。</text>
      </g>

      <g transform="translate(18, 120)">
        <rect x="0" y="2" width="12" height="12" rx="2" fill="#2563EB"/>
        <text x="6" y="11" font-size="9" fill="#FFFFFF" text-anchor="middle" class="font-sans text-bold">✓</text>
        <text x="18" y="12" class="font-sans text-bold" font-size="12" fill="#2563EB">查詢路徑：</text>
        <text x="80" y="12" class="font-sans" font-size="12" fill="#334155">Google AI Studio 左側選單 ➜ 點選「Rate Limit」（網址：https://aistudio.google.com/usage?tab=rate-limit）</text>
      </g>
    </g>

  </g>
</svg>
