<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 640" width="100%" height="100%">
  <defs>
    <!-- 背景漸層 -->
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- 面板視窗底色漸層 -->
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- 步驟標籤漸層 -->
    <linearGradient id="badgeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="badgeGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="badgeOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- 柔和陰影 -->
    <filter id="panelShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="stepShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- 主背景 -->
  <rect width="860" height="640" rx="20" fill="url(#bgCanvas)" />
  <rect width="856" height="636" x="2" y="2" rx="18" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- 頂部標題區 -->
  <g transform="translate(48, 40)">
    <rect x="0" y="0" width="136" height="24" rx="6" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444" stroke-width="1" />
    <text x="68" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FCA5A5" text-anchor="middle">503 尖峰高負載排查</text>
    
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#F8FAFC">Google AI Studio 切換付費 API Key 4 步驟指南</text>
    <text x="0" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">解決「This model is currently experiencing high demand」問題，綁定正式付費專案以享有專屬算力</text>
  </g>

  <!-- 核心面板模擬視窗（還原截圖真實介面） -->
  <g transform="translate(48, 140)" filter="url(#panelShadow)">
    <rect width="480" height="460" rx="16" fill="url(#panelBg)" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- 頂端頁籤列 -->
    <g transform="translate(18, 16)">
      <!-- 返回箭頭 -->
      <path d="M6,14 L12,8 M6,14 L12,20" stroke="#64748B" stroke-width="2" stroke-linecap="round" fill="none" />
      
      <!-- 頁籤群 -->
      <rect x="22" y="0" width="56" height="28" rx="14" fill="#F1F5F9" />
      <text x="50" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Publish</text>

      <rect x="84" y="0" width="62" height="28" rx="14" fill="#F1F5F9" />
      <text x="115" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Versions</text>

      <rect x="152" y="0" width="56" height="28" rx="14" fill="#F1F5F9" />
      <text x="180" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569" text-anchor="middle">GitHub</text>

      <rect x="214" y="0" width="76" height="28" rx="14" fill="#F1F5F9" />
      <text x="252" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Integrations</text>

      <!-- 核心選中頁籤：Secrets -->
      <rect x="296" y="0" width="76" height="28" rx="14" fill="#0F172A" />
      <circle cx="310" cy="14" r="3" fill="#10B981" />
      <text x="342" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Secrets</text>

      <!-- 關閉按鈕 -->
      <path d="M430,8 L438,16 M438,8 L430,16" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round" />
    </g>

    <line x1="0" y1="56" x2="480" y2="56" stroke="#E2E8F0" stroke-width="1" />

    <!-- Secrets 標題列 -->
    <g transform="translate(24, 76)">
      <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Secrets</text>
      <circle cx="68" cy="7" r="6" fill="none" stroke="#64748B" stroke-width="1.2" />
      <text x="68" y="10.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#64748B" text-anchor="middle">i</text>
    </g>

    <!-- 金鑰表格邊框外盒 -->
    <g transform="translate(20, 102)">
      <rect width="440" height="96" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />

      <!-- 表頭 -->
      <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748B">Name</text>
      <text x="160" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748B">Value</text>
      <line x1="0" y1="36" x2="440" y2="36" stroke="#E2E8F0" stroke-width="1" />

      <!-- 第一列：GEMINI_API_KEY -->
      <g transform="translate(12, 46)">
        <!-- Name 輸入框 -->
        <rect width="135" height="36" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
        <text x="10" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#1E293B">GEMINI_API_KEY</text>

        <!-- Value 下拉框 (高亮核心) -->
        <rect x="145" y="0" width="165" height="36" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8" />
        <text x="155" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#1E293B">Gemini API Key • ...c8gA</text>
        <path d="M296,16 L300,20 L304,16" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

        <!-- 眼睛 / 複製 / 垃圾桶圖示 -->
        <circle cx="328" cy="18" r="7" fill="none" stroke="#64748B" stroke-width="1.2" />
        <circle cx="328" cy="18" r="2.5" fill="#64748B" />

        <rect x="348" y="12" width="10" height="12" rx="1.5" fill="none" stroke="#64748B" stroke-width="1.2" />
        
        <path d="M374,12 L384,12 M376,12 L376,24 M382,12 L382,24 M378,9 L380,9" stroke="#64748B" stroke-width="1.2" />
      </g>
    </g>

    <!-- + Add secret 按鈕 -->
    <g transform="translate(20, 210)">
      <rect width="102" height="32" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#475569">+</text>
      <text x="30" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#334155">Add secret</text>
    </g>

    <!-- 底部說明小卡 -->
    <g transform="translate(20, 340)">
      <rect width="440" height="42" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="16" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">💡</text>
      <text x="38" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#64748B">How are secrets handled when sharing?</text>
      <text x="260" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#2563EB">Learn more</text>
    </g>

    <!-- Apply changes 按鈕 (高亮核心) -->
    <g transform="translate(20, 396)">
      <rect width="440" height="42" rx="8" fill="#0F172A" />
      <path d="M166,22 L172,22 M164,15 L174,15 L174,27 L164,27 Z" stroke="#F8FAFC" stroke-width="1.5" fill="none" />
      <text x="184" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Apply changes（套用變更）</text>
    </g>
  </g>

  <!-- 右側：4 步驟詳細教學說明區 -->
  <g transform="translate(548, 140)">
    <!-- 步驟 1 -->
    <g filter="url(#stepShadow)">
      <rect width="264" height="96" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <circle cx="28" cy="28" r="14" fill="url(#badgeBlue)" />
      <text x="28" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
      
      <text x="52" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">點選「Secrets」標籤</text>
      <text x="52" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">在 AI Studio 右側頂部頁籤</text>
      <text x="52" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">找到並切換至「Secrets」管理頁</text>
    </g>

    <!-- 步驟 2 -->
    <g transform="translate(0, 112)" filter="url(#stepShadow)">
      <rect width="264" height="110" rx="12" fill="#1E293B" stroke="#2563EB" stroke-width="1.8" />
      <circle cx="28" cy="28" r="14" fill="url(#badgeOrange)" />
      <text x="28" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
      
      <text x="52" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FBBF24">切換為付費 API Key</text>
      <text x="52" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#CBD5E1">點擊 GEMINI_API_KEY 的 Value 下拉選單</text>
      <text x="52" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#CBD5E1">選擇已綁定 GCP 帳單的專案金鑰</text>
      <text x="52" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#38BDF8">（或點 + Add secret 貼上新 Key）</text>
    </g>

    <!-- 步驟 3 -->
    <g transform="translate(0, 238)" filter="url(#stepShadow)">
      <rect width="264" height="96" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <circle cx="28" cy="28" r="14" fill="url(#badgeGreen)" />
      <text x="28" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
      
      <text x="52" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">點擊「Apply changes」</text>
      <text x="52" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">點擊面板底部的黑色大按鈕</text>
      <text x="52" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">立即將新的金鑰設定儲存至專案中</text>
    </g>

    <!-- 步驟 4 -->
    <g transform="translate(0, 350)" filter="url(#stepShadow)">
      <rect width="264" height="96" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
      <circle cx="28" cy="28" r="14" fill="url(#badgeBlue)" />
      <text x="28" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>
      
      <text x="52" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">回到 Publish 點擊 Republish</text>
      <text x="52" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">切換回 Publish 面板點擊更新</text>
      <text x="52" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">Cloud Run 將即刻套用新金鑰重啟！</text>
    </g>
  </g>
</svg>
